[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "oblisk"
version = "1.0.0"
description = "Multi-agent AI orchestration framework with AES-256-GCM vaults, governance, and symbolic planning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "POWDER-RANGER" }]
keywords = ["ai", "agents", "multi-agent", "orchestration", "governance", "symbolic-ai", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=42.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "aiofiles>=23.0.0",
    "typer>=0.9.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "bandit>=1.7.0",
]

[project.urls]
"Homepage" = "https://github.com/POWDER-RANGER/OBLISK"
"Bug Reports" = "https://github.com/POWDER-RANGER/OBLISK/issues"
"Source" = "https://github.com/POWDER-RANGER/OBLISK"

[project.scripts]
oblisk = "oblisk_cli:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", "examples*"]

# -----------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = """
    --cov=agents
    --cov=core
    --cov=vault
    --cov-branch
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=100
    -v
"""

# -----------------------------------------------------------------------
# coverage
# -----------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["agents", "core", "vault"]
omit = [
    "*/__main__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\.\\.",
]
fail_under = 100
show_missing = true

# -----------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "D"]
"examples/**" = ["S", "ANN", "D", "T201"]

# -----------------------------------------------------------------------
# MyPy
# -----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

# -----------------------------------------------------------------------
# Bandit
# -----------------------------------------------------------------------
[tool.bandit]
targets = ["agents", "core", "vault"]
exclude_dirs = ["tests", "examples"]
skips = []
