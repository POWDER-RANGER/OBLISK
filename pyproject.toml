[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oblisk"
version = "0.2.0"
description = "Multi-agent framework with encrypted vaults"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "POWDER-RANGER" }]
keywords = ["ai", "agents", "multi-agent", "orchestration", "governance", "symbolic-ai", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black", "mypy", "pre-commit"]

[project.urls]
"Homepage" = "https://github.com/POWDER-RANGER/OBLISK"
"Bug Reports" = "https://github.com/POWDER-RANGER/OBLISK/issues"
"Source" = "https://github.com/POWDER-RANGER/OBLISK"

[project.scripts]
oblisk = "oblisk_cli:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", "examples*"]

# -----------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = """
    --cov=oblisk
    --cov-branch
    --cov-fail-under=100
"""

# -----------------------------------------------------------------------
# coverage
# -----------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["agents", "core", "vault"]
omit = [
    "*/__main__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\.\\.",
]
fail_under = 100
show_missing = true

# -----------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "D"]
"examples/**" = ["S", "ANN", "D", "T201"]

# -----------------------------------------------------------------------
# MyPy
# -----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

# -----------------------------------------------------------------------
# Bandit
# -----------------------------------------------------------------------
[tool.bandit]
targets = ["agents", "core", "vault"]
exclude_dirs = ["tests", "examples"]
skips = []
